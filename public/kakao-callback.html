<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카카오 인증 처리 중...</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; }
    .box { text-align: center; color: #475569; }
    .spinner { font-size: 2rem; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner">⚙️</div>
    <p>카카오 인증 처리 중입니다...</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          { type: 'KAKAO_AUTH_CALLBACK', code: code, error: error },
          window.location.origin
        );
      }
    } catch (e) {}
    setTimeout(function () { window.close(); }, 500);
  </script>
</body>
</html>
